services:
  backend:
    build:
      context: ./apps/backend
    image: lliga-sobresalt-backend:latest
    container_name: lliga_sobresalt_backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    environment: &backend_environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      CSRF_COOKIE_SECURE: "True"
      SESSION_COOKIE_SECURE: "True"
      SECURE_SSL_REDIRECT: "True"
      SECURE_HSTS_SECONDS: "31536000"
      PUBLIC_API_RATE_LIMIT_PER_MINUTE: ${PUBLIC_API_RATE_LIMIT_PER_MINUTE:-120}
      PUBLIC_API_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      SCRAPER_MAX_IMAGE_BYTES: ${SCRAPER_MAX_IMAGE_BYTES:-5242880}
      MEDIA_URL: ${MEDIA_URL:-/media/}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      SERVE_MEDIA_FILES: ${SERVE_MEDIA_FILES:-True}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-60}
      OPENROUTER_MAX_ARTICLES_PER_BATCH: ${OPENROUTER_MAX_ARTICLES_PER_BATCH:-5}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-La Lliga del Sobresalt}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/zen/v1}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-big-pickle}
      OPENCODE_TIMEOUT_SECONDS: ${OPENCODE_TIMEOUT_SECONDS:-60}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    networks:
      - dokploy-network
    mem_limit: 768m
    cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/ranking/', headers={'Host': 'sobresalt.yampi.eu', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.lliga-sobresalt-http.rule=Host(`sobresalt.yampi.eu`)
      - traefik.http.routers.lliga-sobresalt-http.entrypoints=web
      - traefik.http.routers.lliga-sobresalt-http.middlewares=redirect-to-https@file
      - traefik.http.routers.lliga-sobresalt-https.rule=Host(`sobresalt.yampi.eu`)
      - traefik.http.routers.lliga-sobresalt-https.entrypoints=websecure
      - traefik.http.routers.lliga-sobresalt-https.tls=true
      - traefik.http.routers.lliga-sobresalt-https.tls.certresolver=letsencrypt
      - traefik.http.services.lliga-sobresalt.loadbalancer.server.port=8000
      - traefik.http.services.lliga-sobresalt.loadbalancer.passhostheader=true

  celery_worker:
    build:
      context: ./apps/backend
    image: lliga-sobresalt-backend:latest
    container_name: lliga_sobresalt_celery_worker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    environment: *backend_environment
    command: celery -A config worker -Q celery -l info
    volumes:
      - media_data:/app/media
    networks:
      - dokploy-network
    mem_limit: 768m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker_llm:
    build:
      context: ./apps/backend
    image: lliga-sobresalt-backend:latest
    container_name: lliga_sobresalt_celery_worker_llm
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    environment: *backend_environment
    command: celery -A config worker -Q llm -c 1 -l info
    volumes:
      - media_data:/app/media
    networks:
      - dokploy-network
    mem_limit: 768m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build:
      context: ./apps/backend
    image: lliga-sobresalt-backend:latest
    container_name: lliga_sobresalt_celery_beat
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    environment: *backend_environment
    command: celery -A config beat -l info
    volumes:
      - media_data:/app/media
    networks:
      - dokploy-network
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true

volumes:
  media_data:
