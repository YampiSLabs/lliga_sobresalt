<!doctype html>
{% load static %}
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}La Lliga del Sobresalt{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-900">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="{% url 'core:home' %}" class="text-xl font-black tracking-wide">La Lliga del Sobresalt</a>
      <a href="{% url 'core:weekly_ranking' %}" class="text-sm font-semibold text-amber-300">Classificació</a>
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-8">
    <div class="mb-6 rounded border border-amber-400/40 bg-amber-300/10 p-4 text-sm text-amber-100">
      {{ disclaimer }}
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
